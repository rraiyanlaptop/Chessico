<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chessico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #262421;
            color: #f1f5f9;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .font-serif {
            font-family: 'Playfair+Display', serif;
        }
        
        /* Chess.com Specific Styles */
        .board-wrapper {
            background-color: #21201d;
            border-radius: 4px;
            padding: clamp(4px, 1.5vw, 12px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .square-texture {
            position: relative;
        }
        
        .square-texture::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.02;
            pointer-events: none;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }

        .piece-transition {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Responsive Eval Bar */
        .eval-bar-container {
            background: #403d39;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        .eval-bar-fill {
            position: absolute;
            background: #fff;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sidebar scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #3d3a37;
            border-radius: 10px;
        }

        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Mobile specific fixes */
        @media (max-width: 1024px) {
            .eval-bar-container {
                width: 100% !important;
                height: 8px !important;
                margin-bottom: 8px;
            }
            .eval-bar-fill {
                bottom: 0; top: 0; left: 0;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "chess.js": "https://esm.sh/chess.js@^1.4.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
